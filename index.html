<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Care Package</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Space+Mono&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4fb;--ink:#171522;--rose:#8b2f72;--card:#ffffff;--line:#e8b9d9;--kraft:#f2a65a;--purple:#5b3cc4;--blue:#2477c9;--teal:#168f87;--dark:#16131f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2622;--ink:#f1e8d8;--rose:#e58b8f;--card:#3a332d;--line:#6b5d4b}}
:root[data-theme="dark"]{--bg:#2b2622;--ink:#f1e8d8;--rose:#e58b8f;--card:#3a332d;--line:#6b5d4b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font-family:'Special Elite','Courier New',monospace;background:radial-gradient(circle at 10% 10%,#ffd8ec 0 12%,transparent 28%),radial-gradient(circle at 90% 15%,#d9e8ff 0 13%,transparent 30%),linear-gradient(135deg,#fff4fb,#fff9e8 48%,#eafcff);background-attachment:fixed}
.pg{display:none;min-height:100vh;padding:24px 18px 40px;text-align:center;animation:f .5s}.pg:before{content:'✦  ✿  ♡  ✦  ✿';display:block;color:#d04a8c;font-size:18px;letter-spacing:10px;margin-bottom:8px}
.pg.on{display:block}
@keyframes f{from{opacity:0}to{opacity:1}}
h1{font:600 clamp(32px,10vw,46px) 'Cormorant Garamond',Georgia,serif;color:var(--purple);margin:0;text-shadow:2px 2px 0 #ffd2e8}
h2{font:600 clamp(24px,7vw,32px) 'Cormorant Garamond',Georgia,serif;color:var(--purple);margin:34px 0 26px;text-shadow:1px 2px 0 #ffd7ec}
#p1{padding-top:12vh}
#box{width:min(78vw,300px);margin:34px auto 26px;cursor:pointer;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.tap{font-size:17px;color:#17131d}.tap span{background:#ffe07a;color:#17131b;padding:0 4px}
.edit{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));font:inherit;font-size:13px;color:var(--rose);background:none;border:2px solid var(--rose);border-radius:10px;padding:8px 12px;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;max-width:390px;margin:0 auto}
.it{background:rgba(255,255,255,.82);border:2px solid var(--line);color:var(--dark);font:inherit;padding:14px 8px;border-radius:20px;box-shadow:0 7px 18px rgba(91,60,196,.12);backdrop-filter:blur(4px)}.it:nth-child(1){border-color:#e8a3c9}.it:nth-child(2){border-color:#9fcaf0}.it:nth-child(3){border-color:#9edbd5}.it:nth-child(4){border-color:#f5c27d}.it:nth-child(5){border-color:#b8a5ee}.it:nth-child(6){border-color:#ef9fa8}
.it .ic{font-size:60px;display:block;transition:transform .2s}
.it:active .ic{transform:scale(1.12) rotate(-4deg)}
.pill{display:inline-block;background:#fff;color:var(--dark);font-size:12px;font-weight:700;border-radius:12px;padding:3px 12px;margin-top:6px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.it.seen .pill{opacity:.55}
.by{margin-top:36px;font-size:12px;color:#5b3cc4;font-weight:700}
dialog{border:3px solid #e7acd0;background:#fff;color:var(--dark);border-radius:6px;padding:26px 20px 20px;width:min(90vw,380px);box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:inherit;text-align:center}
dialog::backdrop{background:rgba(244,234,217,.6);backdrop-filter:blur(5px)}
dialog p{white-space:pre-wrap;line-height:1.6;font-size:16px;margin:6px 0 14px}
.x{position:absolute;right:10px;top:6px;background:none;border:0;font-size:24px;color:var(--ink);padding:6px 10px}
.btn{display:inline-block;font:inherit;font-size:15px;color:var(--rose);background:var(--bg);border:2px solid var(--rose);border-radius:10px;padding:10px 20px;text-decoration:none;min-height:44px}
dialog svg{width:100%;background:#fffdf7;border-radius:4px;border:1px solid var(--line)}
#ed{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px));text-align:left;z-index:9}
#ed.on{display:block}
#ed h3{font:600 28px 'Cormorant Garamond',serif;color:var(--rose);margin:4px 0 14px}
#ed label{display:block;font-size:13px;margin:14px 0 4px;color:var(--rose)}
#ed input,#ed textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px}
#ed textarea{min-height:80px}
#ed .sec{border-top:1px dashed var(--line);margin-top:20px;padding-top:4px;font-size:18px}
#cv{width:100%;aspect-ratio:3/2;background:#fffdf7;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
#out{display:none;margin-top:14px;font-size:13px}
.pol{width:92px;transform:rotate(3deg);border:5px solid #fff;border-bottom-width:16px;box-shadow:0 2px 6px rgba(0,0,0,.3);display:block;margin:0 auto}
.paper{display:block;width:100px;margin:0 auto 4px;background:#fffdf7;transform:rotate(-4deg);box-shadow:0 2px 6px rgba(0,0,0,.25);padding:4px}
.paper svg{display:block;width:100%;border:0}
dialog img.pop{width:100%;border:8px solid #fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.25);transform:rotate(1.5deg);margin-bottom:12px;display:block}
dialog p{font-family:'Space Mono','Courier New',monospace;color:#15131b;font-weight:600}.btn{color:#17131d!important;background:#ffe9f5!important;border-color:#8b2f72!important;font-weight:700}.btn:hover{background:#e7dcff!important}
</style></head><body>

<section class="pg on" id="p1">
  <h1>you've got mail</h1>
  <svg id="box" viewBox="0 0 240 190" aria-label="Open the box">
    <polygon points="10,60 120,30 230,60 120,90" fill="#dcb67b"/>
    <polygon points="10,60 120,90 120,180 10,150" fill="#c99a5b"/>
    <polygon points="230,60 120,90 120,180 230,150" fill="#b98748"/>
    <polygon points="105,34 135,40 135,90 105,84" fill="#e8d3a8" opacity=".85"/>
    <g transform="translate(20,88) skewY(15)"><rect width="88" height="44" fill="#fff" stroke="#222"/><rect width="88" height="12" fill="#111"/>
    <text x="44" y="9" font-size="6" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="700">DIGITAL CARE PACKAGE</text>
    <text x="5" y="22" font-size="5" font-family="Arial" font-weight="700">TO:</text><text id="bt" x="14" y="29" font-size="7"></text>
    <text x="5" y="36" font-size="5" font-family="Arial" font-weight="700">FROM:</text><text id="bf" x="22" y="41" font-size="6"></text></g>
  </svg>
  <div class="tap">tap to <span>open</span></div>
</section>

<section class="pg" id="p2">
  <button class="edit" id="eb">Edit package</button>
  <h2>your little box of goodies</h2>
  <div class="grid" id="grid"></div>
  <div class="by">made with love 💛</div>
</section>

<dialog id="dlg"><button class="x" id="dx" aria-label="close">×</button><div id="dc"></div></dialog>

<section id="ed">
  <h3>Edit your package</h3>
  <label>To</label><input id="f_to"><label>From</label><input id="f_from">
  <div id="fields"></div>
  <div class="sec">Drawing</div>
  <label>Draw with your finger</label><canvas id="cv" width="300" height="200"></canvas>
  <div class="row"><button class="btn" id="clr">clear drawing</button></div>
  <label>Drawing caption</label><input id="f_draw">
  <div class="row"><button class="btn" id="sv">Save &amp; get share link</button><button class="btn" id="cn">Back</button></div>
  <div id="out"><input id="url" readonly><div class="row"><button class="btn" id="cp">Copy link</button></div></div>
</section>
